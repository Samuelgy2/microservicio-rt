    spring.application.name=api
server.port=8000

# ===================== MySQL (JDBC) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/rt1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Nombre de la tabla de transacciones en la base rt1
app.tabla.transacciones=transactions

# ===================== Paginacion =====================
app.paginacion.tamano-defecto=10
app.paginacion.tamano-maximo=100

# ===================== CORS =====================
# Lista separada por comas. Use * para permitir cualquier origen.
app.cors.allowed-origins=*

# ===================== Logs =====================
logging.file.path=logs
logging.level.root=INFO
logging.level.com.microserviviort.api=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

# No exponer trazas en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
